# Pre-commit hooks for Python + data repos
# Install dev deps:  uv sync --group dev
# Enable hooks:      pre-commit install
# Run all files:     pre-commit run --all-files
# Update hooks:      pre-commit autoupdate
# Skip once:         git commit --no-verify

repos:
  # ---------------------------------------------------------------------------
  # Ruff: fast linter + formatter
  # ---------------------------------------------------------------------------
  # Local hooks run the locked ruff, as CI does.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        language: system
        entry: uv run ruff check --fix --force-exclude
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        name: ruff format
        language: system
        entry: uv run ruff format --force-exclude
        types_or: [python, pyi, jupyter]

  # ---------------------------------------------------------------------------
  # Core hygiene, JSON/YAML/TOML, security
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Whitespace & endings
      # Hooks skip pipeline data under data/.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^data/
      - id: end-of-file-fixer
        exclude: ^data/
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^data/

      # Conflicts & platform quirks
      - id: check-case-conflict
      - id: check-merge-conflict

      # Python sanity
      - id: debug-statements
      - id: check-ast
      - id: check-shebang-scripts-are-executable
      - id: check-builtin-literals
      - id: check-docstring-first

      # Config/data formats
      - id: check-json
      - id: pretty-format-json
        args: [--autofix, --indent=2, --no-sort-keys]
        exclude: |
          (?x)^(
            data/.*|
            \.idea/.*|
            \.vscode/.*
          )$
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml

      # Basic secret hygiene
      - id: detect-private-key

      # Large files (5 MB) with sensible excludes
      - id: check-added-large-files
        args: [--maxkb=5000]
        exclude: |
          (?x)^(
            .*\.parquet|
            .*\.feather|
            uv\.lock
          )$

  # ---------------------------------------------------------------------------
  # Type checking (uses settings from pyproject.toml)
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: ty
        name: ty type check
        language: system
        entry: uv run ty check
        types: [python]
        pass_filenames: false

  # ---------------------------------------------------------------------------
  # Spelling (docs + code comments)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        # "ND" (non disponible) marks missing values in DRC sitreps.
        args: [--write-changes, --ignore-words-list=nd]
        exclude: |
          (?x)^(
            .*\.lock|
            .*\.parquet|
            .*\.feather|
            data/.*|
            tests/fixtures/.*
          )$

  # ---------------------------------------------------------------------------
  # GitHub Actions linting
  # ---------------------------------------------------------------------------
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # ---------------------------------------------------------------------------
  # Markdown formatting (GFM + front matter)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm>=1.0.0
          - mdformat-frontmatter>=2.1.0
        # To limit it to docs: files: ^(README\.md|docs/|.*/README\.md)$
