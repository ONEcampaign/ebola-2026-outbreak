name: WHO scrape

on:
  schedule:
    # WHO updates its table at no fixed time and not every day, so check
    # every 2 hours, on the hour, between the sitrep runs at half past.
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Outside the daily-scrape group, so a queued sitrep run cannot cancel a
# capture. WHO shows only the latest figures, so a lost day cannot be recovered.
concurrency:
  group: who-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: Set up Python 3.13
        run: uv python install '3.13'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Scrape WHO table
        run: uv run python src/ebola_2026_outbreak/drc_2026_who.py

      - name: Commit WHO table
        run: |
          git add data/processed/drc_2026_who_by_country.csv
          if git diff --cached --quiet; then
            echo "No WHO changes"
            exit 0
          fi
          git commit -m "data: WHO Bundibugyo table $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push

      # The chart tables read the WHO table, so rebuild them here instead of
      # waiting for the next daily scrape.
      - name: Build chart tables
        run: uv run python src/ebola_2026_outbreak/chart_tables.py

      - name: Commit chart tables
        run: |
          git add data/output/*.csv data/output/*.json
          if git diff --cached --quiet; then
            echo "No chart table changes"
            exit 0
          fi
          git commit -m "data: chart tables $(date -u +%Y-%m-%d)"
          # On a conflict, drop the local commit. The tables are a pure
          # function of committed state, so the next run rebuilds them.
          git pull --rebase || { git rebase --abort; git reset --hard '@{u}'; exit 1; }
          git push
