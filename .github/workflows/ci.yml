name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Full history gives the release check a merge base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: Set up Python 3.13
        run: uv python install '3.13'

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run ty
        run: uv run ty check 'src/ebola_2026_outbreak'

      - name: Run tests
        run: uv run pytest

      # The review check runs the base branch's code and cannot see a code
      # change that would hold a released upload. This step runs the pull
      # request's own code.
      - name: Check release
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: uv run python src/ebola_2026_outbreak/drc_2026_sitreps_extract.py check-release --base "origin/$BASE_REF"
