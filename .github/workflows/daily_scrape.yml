name: DRC 2026 sitrep scrape

on:
  schedule:
    # INSP uploads sitreps at any hour (mostly 04:00-12:00 UTC, some after
    # 20:00), so check every 2 hours. A later run also retries one cancelled
    # by a queued release run in the shared concurrency group. Download,
    # extract and release are idempotent and the cache means no sitrep is paid
    # for twice, so a run with no new sitrep only rebuilds the chart tables,
    # which also picks up any new WHO figures.
    - cron: "30 */2 * * *"
  workflow_dispatch:

# No dev tool runs here, and uv run would otherwise sync the dev group back in.
env:
  UV_NO_DEV: "1"

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      # A queued run builds from the tip of main, whatever SHA queued it.
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: Set up Python 3.13
        run: uv python install '3.13'

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # The manifest records media already seen, so only new sitreps download.
      - name: Download new sitreps
        run: uv run python src/ebola_2026_outbreak/drc_2026_sitreps_download.py

      # The only step with the model API keys. It caches each new sitrep's
      # answers. An API error leaves the upload pending for the next run.
      - name: Extract zone data
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: uv run python src/ebola_2026_outbreak/drc_2026_sitreps_extract.py extract

      # Commit the paid-for answers and the ledger before release, so a release
      # that fails does not discard them.
      - name: Commit extractions
        run: |
          git add data/interim/drc_2026_sitrep_extractions data/processed/drc_2026_sitrep_manifest.csv data/processed/drc_2026_sitrep_extraction_status.csv
          if git diff --cached --quiet; then
            echo "No extraction changes"
            exit 0
          fi
          git commit -m "data: DRC 2026 sitrep extractions $(date -u +%Y-%m-%d)"
          # A WHO push can land between the pull and the push, so retry. Failing
          # here would lose the answers just paid for.
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::error::Could not push the extractions after 3 attempts"
          exit 1

      # Release needs no keys. It opens an issue for any report held for review.
      # A failure here must not stop the province steps, so the job fails at the
      # end.
      - name: Release zone data
        id: release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python src/ebola_2026_outbreak/drc_2026_sitreps_extract.py release

      - name: Commit zone data
        id: commit_zone
        continue-on-error: true
        run: |
          git add data/review/drc_2026 data/processed/drc_2026_sitrep_*.csv
          if git diff --cached --quiet; then
            echo "No zone data changes"
            exit 0
          fi
          git commit -m "data: DRC 2026 sitrep zone data $(date -u +%Y-%m-%d)"
          # On a conflict, drop the local commit. Release output is a pure
          # function of committed state, so the next run rebuilds it.
          git pull --rebase || { git rebase --abort; git reset --hard '@{u}'; exit 1; }
          git push

      - name: Parse new sitreps
        run: uv run python src/ebola_2026_outbreak/drc_2026_sitreps_parse.py

      - name: Build national series
        run: uv run python src/ebola_2026_outbreak/drc_2026_final.py

      - name: Commit sitrep data
        run: |
          git add data/processed/drc_2026_*.csv
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "data: DRC 2026 sitreps $(date -u +%Y-%m-%d)"
          # On a conflict, drop the local commit. The next run rebuilds it.
          git pull --rebase || { git rebase --abort; git reset --hard '@{u}'; exit 1; }
          git push

      # continue-on-error hides a zone failure from the job result. This step
      # runs only when no earlier step hard-failed, and restores the failure.
      - name: Fail on zone release error
        if: steps.release.outcome == 'failure' || steps.commit_zone.outcome == 'failure'
        run: |
          echo "::error::Zone release or its commit failed; see the Release zone data and Commit zone data steps"
          exit 1

  # The only writer of data/output. The tables read the sitrep series and the
  # WHO table, so they rebuild even when the scrape job fails, and new WHO
  # figures still reach the charts.
  tables:
    needs: scrape
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # The tip of main includes whatever the scrape job pushed.
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: Set up Python 3.13
        run: uv python install '3.13'

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build chart tables
        run: uv run python src/ebola_2026_outbreak/chart_tables.py

      - name: Commit chart tables
        run: |
          git add data/output/*.csv data/output/*.json
          if git diff --cached --quiet; then
            echo "No chart table changes"
            exit 0
          fi
          git commit -m "data: chart tables $(date -u +%Y-%m-%d)"
          # On a conflict, drop the local commit. The tables are a pure
          # function of committed state, so the next run rebuilds them.
          git pull --rebase || { git rebase --abort; git reset --hard '@{u}'; exit 1; }
          git push
