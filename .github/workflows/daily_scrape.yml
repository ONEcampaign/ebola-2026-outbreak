name: Daily DRC 2026 sitrep scrape

on:
  schedule:
    # DRC sitreps land the morning after the report date. The second run
    # retries the day when a pending run was cancelled by a queued release run
    # in the shared concurrency group. Download, extract and release are
    # idempotent and the cache means no sitrep is paid for twice, so a second
    # run on a quiet day does nothing.
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: Set up Python 3.13
        run: uv python install '3.13'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # The manifest records media already seen, so only new sitreps download.
      - name: Download new sitreps
        run: uv run python src/ebola_2026_outbreak/drc_2026_sitreps_download.py

      # The only step with the model API keys. It caches each new sitrep's
      # answers; an API error leaves the upload pending for the next run.
      - name: Extract zone data
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: uv run python src/ebola_2026_outbreak/drc_2026_sitreps_extract.py extract

      # Commit the paid-for answers and the ledger before release, so a release
      # that fails does not discard them.
      - name: Commit extractions
        run: |
          git add data/interim/drc_2026_sitrep_extractions data/processed/drc_2026_sitrep_manifest.csv data/processed/drc_2026_sitrep_extraction_status.csv
          if git diff --cached --quiet; then
            echo "No extraction changes"
            exit 0
          fi
          git commit -m "data: DRC 2026 sitrep extractions $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push

      # Release needs no keys. It opens an issue for any report held for review.
      # A failure here must not stop the province steps, so the job fails at the
      # end instead.
      - name: Release zone data
        id: release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python src/ebola_2026_outbreak/drc_2026_sitreps_extract.py release

      - name: Commit zone data
        id: commit_zone
        continue-on-error: true
        run: |
          git add data/review/drc_2026 data/processed/drc_2026_sitrep_*.csv
          if git diff --cached --quiet; then
            echo "No zone data changes"
            exit 0
          fi
          git commit -m "data: DRC 2026 sitrep zone data $(date -u +%Y-%m-%d)"
          # On a conflict, drop the local commit: release output is a pure
          # function of committed state, so the next run rebuilds it.
          git pull --rebase || { git rebase --abort; git reset --hard '@{u}'; exit 1; }
          git push

      - name: Parse new sitreps
        run: uv run python src/ebola_2026_outbreak/drc_2026_sitreps_parse.py

      - name: Build national series
        run: uv run python src/ebola_2026_outbreak/drc_2026_final.py

      - name: Build chart tables
        run: uv run python src/ebola_2026_outbreak/chart_tables.py

      - name: Commit sitrep data
        run: |
          git add data/processed/drc_2026_*.csv data/output/*.csv data/output/*.json
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "data: DRC 2026 sitreps $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push

      # continue-on-error hides a zone failure from the job result. This step
      # runs only when every earlier step did not hard-fail, and restores it.
      - name: Fail on zone release error
        if: steps.release.outcome == 'failure' || steps.commit_zone.outcome == 'failure'
        run: |
          echo "::error::Zone release or its commit failed; see the Release zone data and Commit zone data steps"
          exit 1
